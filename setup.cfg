
# Configuration for Accounts REST API Service

# Nose Test Configuration
[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1
cover-html=1
cover-html-dir=coverage
cover-branches=1
with-xunit=1
xunit-file=nosetests.xml

# Coverage Configuration
[coverage:run]
branch = True
source = service
omit =
    */tests/*
    */__init__.py

[coverage:report]
show_missing = True
precision = 2
fail_under = 80

[coverage:html]
directory = coverage

# Flake8 Configuration
[flake8]
max-line-length = 120
max-complexity = 10
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist
ignore = E203,W503

# Pylint Configuration
[pylint.MASTER]
ignore = tests
jobs = 0

[pylint.FORMAT]
max-line-length = 120

[pylint.MESSAGES CONTROL]
disable =
    C0114,
    C0115,
    C0116,
    R0903

[pylint.REPORTS]
reports = yes
score = yes
