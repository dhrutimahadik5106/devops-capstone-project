
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci-build
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/dhrutimahadik5106/devops-capstone-project.git
    - name: revision
      type: string
      default: main

  workspaces:
    - name: shared-workspace

  tasks:
    - name: checkout
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: lint
      runAfter:
        - checkout
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: flake8
            image: python:3.11-slim
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/sh
              set -e
              pip install flake8
              flake8 service tests --count --show-source --statistics
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: unit-tests
      runAfter:
        - lint
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: nosetests
            image: python:3.9-slim
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/sh
              set -e
              pip install -r requirements.txt
              pip install nose
              nosetests -v tests
      workspaces:
        - name: source
          workspace: shared-workspace
